baseURL = 'https://iqss.github.io/website-re-redesign/'
languageCode = 'en'
title = 'Harvard Institute for Quantitative Social Science'

[params]
  subtitle = 'Harvard Institute for Quantitative Social Science Archive'
  description = 'A comprehensive archive and clone of the IQSS website content'
  author = 'IQSS Archive'
  # Prototype only: adds a robots noindex tag to every page so this copy
  # doesn't compete with iq.harvard.edu in search results. Set to false
  # (or delete) when this site becomes the official one.
  noindex = true

summaryLength = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Taxonomies. tag and category are Hugo's defaults and are restated here
# because declaring this block replaces them; one page uses each. `series`
# groups events into their recurring series (Alesina, APRW, Applied Stats),
# which is how iq.harvard.edu does it — its Alesina page is literally a
# term page reading "Content tagged with Alesina Seminar on Political Economy".
[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"
  event_type = "event-type"
  program = "program"
  research_technology = "research-technology"
  service = "service"

# ── Menu ───────────────────────────────────────────────────────────────
# Mirrors the information architecture of iq.harvard.edu, which was built
# from user research: six top-level sections, each a real landing page that
# is itself clickable, with its section pages in a dropdown beneath.
#
# "AI for Social Science" is promoted to top level at leadership's request;
# on the live site it has no equivalent. The six-item row measures 823px, so
# the horizontal nav survives down to an 863px viewport.
#
# Hugo builds the tree from `identifier` + `parent`.

# ── About ──
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10

