{{ define "main" }}
<div class="opportunities-page">
    <!-- Page Header -->
    <div class="opp-header">
        <div class="container">
            <h1>{{ .Title }}</h1>
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="opp-breadcrumb">
        <div class="container">
            <a href="{{ .Site.Home.RelPermalink }}">Home</a> &rsaquo; <a href="{{ "about/" | relURL }}">About</a> &rsaquo; <span>{{ .Title }}</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="opp-content">
        <div class="container">
            <div class="opp-layout">
                <div class="opp-main">
                    {{/* The copy lives in content/opportunities/_index.md (live's text, verbatim); it was hard-coded here until 2026-11-18. */}}
                    <section class="opp-section opp-body">
                        {{ .Content }}
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.opportunities-page {
    margin: 0;
    padding: 0;
}

.opp-header {
    background: linear-gradient(135deg, var(--orange-brand) 0%, #B8460A 100%);
    color: white;
    padding: 50px 0;
}

.opp-header h1 {
    font-size: 42px;
    font-weight: 300;
    margin: 0;
}

.opp-breadcrumb {
    background: #f8f9fa;
    padding: 15px 0;
    border-bottom: 1px solid #e5e5e5;
    font-size: 14px;
}

.opp-breadcrumb a {
    color: var(--orange-brand);
    text-decoration: none;
}

.opp-breadcrumb a:hover {
    text-decoration: underline;
}

.opp-breadcrumb span {
    color: #666;
}

.opp-content {
    padding: 50px 0;
}

.opp-layout {
    display: flex;
    gap: 60px;
    max-width: 1200px;
    margin: 0 auto;
}

.opp-sidebar {
    flex: 0 0 240px;
}

.opp-sidebar ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.opp-sidebar li {
    border-bottom: 1px solid #e5e5e5;
}

.opp-sidebar li:first-child {
    border-top: 1px solid #e5e5e5;
}

.opp-sidebar li a {
    display: block;
    padding: 12px 15px;
    color: #333;
    text-decoration: none;
    font-size: 15px;
    transition: background 0.2s ease, color 0.2s ease;
}

.opp-sidebar li a:hover {
    background: #f8f9fa;
    color: var(--orange-brand);
}

.opp-sidebar li.active a {
    color: var(--orange-brand);
    font-weight: 600;
    border-left: 3px solid #CC5500;
    padding-left: 12px;
}

.opp-main {
    flex: 1;
}

.opp-intro {
    margin-bottom: 40px;
}

.opp-intro p {
    font-size: 17px;
    line-height: 1.7;
    color: #444;
}

.opp-section {
    margin-bottom: 35px;
    padding-bottom: 35px;
    border-bottom: 1px solid #f0f0f0;
}

.opp-section:last-child {
    border-bottom: none;
}

.opp-section h2 {
    font-size: 24px;
    font-weight: 500;
    color: var(--orange-brand);
    margin-bottom: 12px;
}

/* Live's copy, rendered from content/opportunities/_index.md, runs as one
   flow of paragraphs and headings rather than separate sections. */
.opp-body h2 {
    margin-top: 36px;
}

.opp-body h3 {
    margin: 24px 0 8px;
}

.opp-body ul {
    padding-left: 22px;
    margin: 0 0 16px;
    color: #444;
}

.opp-body p {
    margin: 0 0 14px;
}

{{ partial "openings-css.html" . | safeCSS }}

.opp-section p {
    font-size: 16px;
    line-height: 1.6;
    color: #444;
    margin-bottom: 15px;
}

.opp-section a {
    color: var(--orange-brand);
    text-decoration: none;
}

.opp-section a:hover {
    text-decoration: underline;
}

.opp-listing {
    background: #f8f9fa;
    border-left: 3px solid #CC5500;
    padding: 15px 20px;
    margin: 12px 0;
    border-radius: 0 6px 6px 0;
}

.opp-listing h3 {
    font-size: 16px;
    font-weight: 500;
    margin: 0;
}

.opp-listing h3 a {
    color: var(--orange-brand);
    text-decoration: none;
}

.opp-listing h3 a:hover {
    text-decoration: underline;
}

@media (max-width: 768px) {
    .opp-header h1 {
        font-size: 32px;
    }

    .opp-layout {
        flex-direction: column;
        gap: 30px;
    }

    .opp-sidebar {
        flex: none;
    }

    .opp-content {
        padding: 30px 0;
    }
}
</style>
{{ end }}
